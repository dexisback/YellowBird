services:
  postgres:
    image: postgres:16-alpine
    container_name: yellowbird-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: yellowbird
      POSTGRES_USER: yellowbird
      POSTGRES_PASSWORD: yellowbird

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yellowbird -d yellowbird"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yellowbird-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api

    container_name: yellowbird-api
    restart: unless-stopped

    environment:
      PORT: "8080"

      DATABASE_URL: "postgres://yellowbird:yellowbird@postgres:5432/yellowbird?sslmode=disable"

      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"

      JWT_SECRET: "${JWT_SECRET}"

      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker

    container_name: yellowbird-worker
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgres://yellowbird:yellowbird@postgres:5432/yellowbird?sslmode=disable"

      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"

      JWT_SECRET: "${JWT_SECRET}"

      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: