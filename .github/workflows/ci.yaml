name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: go test -tags=integration ./tests/integration/...

      - name: E2E tests
        run: go test -tags=e2e ./tests/e2e/...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API
        run: |
          docker build \
            -f deployments/Dockerfile.api \
            -t yellowbird-api:ci \
            .

      - name: Build Worker
        run: |
          docker build \
            -f deployments/Dockerfile.worker \
            -t yellowbird-worker:ci \
            .
            