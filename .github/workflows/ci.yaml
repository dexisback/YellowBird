name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify Dependencies
        run: |
          go mod download
          go mod verify

      - name: Check Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Run Race Detector
        run: go test -race -v ./internal/...

      - name: Run Integration Tests
        run: go test -tags=integration -v ./tests/integration/...

      - name: Run End-to-End Tests
        run: go test -tags=e2e -v ./tests/e2e/...

      - name: Build API Binary
        run: go build -v -o /dev/null ./cmd/api

      - name: Build Worker Binary
        run: go build -v -o /dev/null ./cmd/worker

  docker:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: |
          docker build \
            -f deployments/Dockerfile.api \
            -t yellowbird-api:ci \
            .

      - name: Build Worker Docker Image
        run: |
          docker build \
            -f deployments/Dockerfile.worker \
            -t yellowbird-worker:ci \
            .